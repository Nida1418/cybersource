name: Circulation Service CI

on:
  push:
    paths:
      - 'circulation-service/**'
  pull_request:
    paths:
      - 'circulation-service/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        working-directory: ./circulation-service
        run: mvn clean verify
