spring.application.name=circulation-service
spring.datasource.url=jdbc:postgresql://localhost:5432/circulation_db
spring.datasource.username=concord
spring.datasource.password=concord
spring.jpa.hibernate.ddl-auto=update
server.port=8082
catalog.service.url=http://localhost:8081
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/concord/protocol/openid-connect/certs
circulation.service.url=http://localhost:8082
resilience4j.circuitbreaker.instances.catalogService.sliding-window-size=10
resilience4j.circuitbreaker.instances.catalogService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.catalogService.wait-duration-in-open-state=30000
resilience4j.circuitbreaker.instances.catalogService.permitted-number-of-calls-in-half-open-state=3
spring.data.redis.host=localhost
spring.data.redis.port=6379
management.endpoints.web.exposure.include=circuitbreakers,circuitbreakerevents
management.endpoint.circuitbreakers.enabled=true
spring.jpa.show-sql=true
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
