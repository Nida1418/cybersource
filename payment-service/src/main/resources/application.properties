spring.application.name=payment-service
server.port=8083
spring.datasource.url=jdbc:postgresql://localhost:5432/payment_db
spring.datasource.username=concord
spring.datasource.password=concord
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=payment-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer= org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer= org.apache.kafka.common.serialization.StringDeserializer
cybersource.merchant-id=${CYBS_MERCHANT_ID}
cybersource.key-id=${CYBS_KEY_ID}
cybersource.shared-secret=${CYBS_SHARED_SECRET}
cybersource.run-environment=apitest.cybersource.com